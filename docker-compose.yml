version: "3.9"

services:

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "5000:5000"
    env_file:
      - ./services/api-gateway/.env

  vehicle-service:
    build: ./services/vehicle-service
    ports:
      - "5003:5003"
    env_file:
      - ./services/vehicle-service/.env